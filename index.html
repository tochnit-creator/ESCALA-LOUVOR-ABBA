<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala de Louvor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #FF7A00;
    --neon2: #FFB347;
    --gold: #FF7A00;
    --gold-light: #FFB347;
    --dark: #080808;
    --surface: #111111;
    --surface2: #161616;
    --surface3: #1E1E1E;
    --border: #FF7A00;
    --text: #F5F0E8;
    --muted: #777;
    --danger: #E05555;
    --accent: #FFB347;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0D0D0D;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    position: relative;
    overflow: hidden;
    border-bottom: 2px solid #FF7A00;
    box-shadow: 0 4px 32px rgba(255,122,0,0.3);
    padding: 0;
    height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    text-align: center;
  }
  .header-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 30%;
    opacity: 0.38;
    filter: brightness(0.9) saturate(1.2);
  }
  .header-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 100%);
  }
  .header-content {
    position: relative;
    z-index: 2;
    padding: 0 24px 20px;
  }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow: 0 0 24px rgba(255,122,0,0.6), 0 2px 8px rgba(0,0,0,0.8);
  }
  .header p { display: none; }
  .header-logo { display: none; }

  /* ── LAYOUT ── */
  .container { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ── TABS ── */
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; }
  .tab {
    flex: 1; padding: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; border-radius: 8px; transition: all .2s; text-align: center;
  }
  .tab.active { background: linear-gradient(135deg, #FF7A00, #FF3D00); color: #fff; border: none; box-shadow: 0 0 16px rgba(255,122,0,0.4); }
  .tab:hover:not(.active) { border-color: var(--gold); color: var(--gold); }

  /* ── SECTIONS ── */
  .section { display: none; }
  .section.active { display: block; }

  /* ── CARDS ── */
  @keyframes borderGlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: var(--surface);
    border: none;
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    z-index: 0;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    padding: 1.5px;
    background: linear-gradient(135deg, #FF7A00, #FF3D00, #FFB347, #FF7A00);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    box-shadow: 0 0 18px rgba(255,122,0,0.18), inset 0 0 0 0 transparent;
    z-index: -1;
    pointer-events: none;
  }
  .card-title {
    font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 18px;
  }

  /* ── FORM ── */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }

  .field label {
    display: block; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2);
    border: 1px solid rgba(255,122,0,0.3);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    transition: border-color .25s, box-shadow .25s;
    outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--neon);
    box-shadow: 0 0 0 2px rgba(255,122,0,0.2), 0 0 12px rgba(255,122,0,0.15);
  }
  .field select option { background: var(--surface2); }
  .field textarea { resize: vertical; min-height: 70px; }

  /* ── MÚSICAS ── */
  .musica-item {
    background: var(--surface2);
    border: none;
    border-radius: 11px; padding: 16px 16px 16px 44px; margin-bottom: 12px;
    position: relative; cursor: default;
    z-index: 0;
  }
  .musica-item::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 11px;
    padding: 1px;
    background: linear-gradient(120deg, #FF7A00, #FF3D00, #FFB347, #FF7A00);
    background-size: 300% 300%;
    animation: borderGlow 5s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: -1;
  }
  .musica-item.dragging { opacity: .4; border: 1px dashed #555; }
  .musica-item.drag-over { border-color: var(--gold); background: #222; }
  .drag-handle {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #444; cursor: grab; font-size: 18px; line-height: 1;
    user-select: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .musica-num {
    font-size: 10px; color: var(--gold); font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px;
  }
  .btn-remove {
    position: absolute; top: 12px; right: 12px;
    background: none; border: 1px solid #333; border-radius: 6px;
    color: var(--muted); cursor: pointer; padding: 4px 8px; font-size: 12px;
    transition: all .2s;
  }
  .btn-remove:hover { border-color: var(--danger); color: var(--danger); }

  /* ── BOTÕES ── */
  .btn {
    padding: 12px 24px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
    border: none; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--gold); color: #000; }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-secondary {
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold);
  }
  .btn-secondary:hover { background: rgba(201,168,76,.1); }
  .btn-ghost {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }

  /* ── LINK BOX ── */
  .link-box {
    background: var(--surface2);
    border: 1px solid rgba(255,122,0,0.5);
    border-radius: 10px; padding: 20px; margin-top: 24px; display: none;
    box-shadow: 0 0 20px rgba(255,122,0,0.12);
  }
  .link-box label { font-size: 11px; color: var(--gold); font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }
  .link-row { display: flex; gap: 8px; }
  .link-row input {
    flex: 1; background: var(--surface3); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--muted);
    font-size: 12px; font-family: monospace; outline: none;
  }
  .copied-badge {
    display: none; font-size: 12px; color: #5cc87a; margin-top: 8px;
  }

  /* ── VIEW MODE ── */
  .view-header {
    text-align: center; padding: 32px 0 24px;
    border-bottom: 1px solid var(--border); margin-bottom: 28px;
  }
  .view-header h2 {
    font-family: 'Playfair Display', serif; font-size: 28px;
    color: var(--gold-light); margin-bottom: 6px;
  }
  .view-header .church { font-size: 14px; color: var(--muted); }
  .view-header .date {
    font-size: 13px; color: var(--gold); margin-top: 4px;
    font-weight: 600; letter-spacing: 0.5px;
  }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .info-chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px;
  }
  .info-chip .ic-label { font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600; margin-bottom: 4px; }
  .info-chip .ic-value { font-size: 14px; font-weight: 500; }

  .musicas-view { margin-top: 24px; }
  .musicas-view h3 {
    font-size: 11px; color: var(--gold); font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px;
  }

  .musica-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 10px;
    display: grid; grid-template-columns: 32px 1fr; gap: 16px; align-items: start;
  }
  .musica-order {
    width: 32px; height: 32px; background: var(--gold); color: #000;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px; flex-shrink: 0;
  }
  .musica-nome { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .musica-artista { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .vozes { display: flex; flex-wrap: wrap; gap: 8px; }
  .voz-tag {
    font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600;
    letter-spacing: 0.3px;
  }
  .voz-1 { background: rgba(201,168,76,.15); color: var(--gold); border: 1px solid rgba(201,168,76,.3); }
  .voz-2 { background: rgba(100,160,255,.15); color: #7ab8ff; border: 1px solid rgba(100,160,255,.3); }
  .voz-extra { background: rgba(160,255,160,.12); color: #80d080; border: 1px solid rgba(160,255,160,.25); }
  .tom-tag { background: var(--surface3); color: var(--muted); border: 1px solid var(--border); }

  .obs-block {
    background: rgba(201,168,76,.06); border-left: 3px solid var(--gold);
    border-radius: 0 8px 8px 0; padding: 12px 16px; margin-top: 20px;
    font-size: 13px; color: var(--muted); line-height: 1.6;
  }
  .obs-block strong { color: var(--gold); display: block; margin-bottom: 4px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px; }

  .btn-novo { margin-top: 28px; width: 100%; text-align: center;
    padding: 14px; }

  /* ── MODAL SENHA ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 999;
    align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #161616; border: none; border-radius: 14px;
    padding: 32px 28px; width: 90%; max-width: 360px;
    position: relative; z-index: 0;
  }
  .modal-box::before {
    content: '';
    position: absolute;
    inset: 0; border-radius: 14px; padding: 1.5px;
    background: linear-gradient(135deg, #FF7A00, #FF3D00, #FFB347, #FF7A00);
    background-size: 300% 300%;
    animation: borderGlow 4s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    z-index: -1;
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 3px;
    color: #fff; margin-bottom: 6px;
  }
  .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .modal-input {
    width: 100%; background: #1E1E1E;
    border: 1px solid rgba(255,122,0,0.3);
    border-radius: 8px; padding: 11px 14px;
    color: var(--text); font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    outline: none; margin-bottom: 8px;
    transition: border-color .2s, box-shadow .2s;
    letter-spacing: 3px;
  }
  .modal-input:focus {
    border-color: var(--neon);
    box-shadow: 0 0 12px rgba(255,122,0,0.2);
  }
  .modal-error {
    font-size: 12px; color: var(--danger);
    margin-bottom: 14px; min-height: 18px;
  }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* Campo de definição de senha no editor */
  .senha-field {
    background: rgba(255,122,0,0.05);
    border: 1px solid rgba(255,122,0,0.2);
    border-radius: 10px; padding: 14px 16px;
    margin-top: 16px;
  }
  .senha-field label {
    font-size: 11px; font-weight: 600; color: var(--neon);
    text-transform: uppercase; letter-spacing: 1px;
    display: block; margin-bottom: 6px;
  }
  .senha-field input {
    width: 100%; background: var(--surface2);
    border: 1px solid rgba(255,122,0,0.3);
    border-radius: 8px; padding: 10px 14px;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
    letter-spacing: 2px;
  }
  .senha-field input:focus {
    border-color: var(--neon);
    box-shadow: 0 0 10px rgba(255,122,0,0.15);
  }
  .senha-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* ── MOMENTO TAGS ── */
  .momento-badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 20px; margin-left: 8px;
  }
  .m-entrada { background: rgba(80,200,120,.15); color: #50c878; }
  .m-adoracao { background: rgba(201,168,76,.15); color: var(--gold); }
  .m-ofertorio { background: rgba(200,120,255,.15); color: #c878ff; }
  .m-encerramento { background: rgba(255,120,80,.15); color: #ff9060; }
  .m-outro { background: rgba(120,180,255,.15); color: #78b4ff; }

  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
    .form-row.three { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .header { padding: 20px 16px; }
    .container { padding: 20px 14px 50px; }
  }
</style>
</head>

<script>
// ── ESTADO ──────────────────────────────────────────────
let musicaCount = 0;

// ── DIA DA SEMANA ─────────────────────────────────────────
function atualizarDiaSemana() {
  const val = document.getElementById('ig-data').value;
  const el = document.getElementById('dia-semana');
  if (!val) { el.textContent = ''; return; }
  const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const d = new Date(val + 'T12:00:00');
  el.textContent = dias[d.getDay()];
}

// ── CONTADOR DE MÚSICAS ───────────────────────────────────
function atualizarContador() {
  const items = document.querySelectorAll('.musica-item');
  const counter = document.getElementById('musicas-counter');
  if (!counter) return;
  const n = items.length;
  const dataVal = document.getElementById('ig-data')?.value || '';
  let extra = '';
  if (dataVal) {
    const [y,m,d] = dataVal.split('-');
    extra = ' · ' + d + '/' + m;
  }
  counter.textContent = n + (n === 1 ? ' música' : ' músicas') + extra;
}

// ── DRAG AND DROP ─────────────────────────────────────────
let dragSrc = null;
function initDragDrop(el) {
  el.addEventListener('dragstart', function(e) {
    dragSrc = this;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', function() {
    this.classList.remove('dragging');
    document.querySelectorAll('.musica-item').forEach(i => i.classList.remove('drag-over'));
    renumerar();
    atualizarContador();
  });
  el.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.musica-item').forEach(i => i.classList.remove('drag-over'));
    this.classList.add('drag-over');
    return false;
  });
  el.addEventListener('drop', function(e) {
    e.stopPropagation();
    if (dragSrc !== this) {
      const list = document.getElementById('musicas-list');
      const allItems = [...list.querySelectorAll('.musica-item')];
      const srcIdx = allItems.indexOf(dragSrc);
      const dstIdx = allItems.indexOf(this);
      if (srcIdx < dstIdx) list.insertBefore(dragSrc, this.nextSibling);
      else list.insertBefore(dragSrc, this);
    }
    return false;
  });
}

function renumerar() {
  document.querySelectorAll('.musica-item').forEach((item, idx) => {
    const num = item.querySelector('.musica-num');
    if (num) num.textContent = '🎵 Música ' + (idx + 1);
  });
}

const momentoClasses = {
  'Entrada': 'm-entrada',
  'Adoração': 'm-adoracao',
  'Ofertório': 'm-ofertorio',
  'Encerramento': 'm-encerramento',
  'Outro': 'm-outro',
};

// ── TABS ─────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (tab === 'editor' ? 0 : 1) === i);
  });
  document.getElementById('sec-editor').classList.toggle('active', tab === 'editor');
  document.getElementById('sec-preview').classList.toggle('active', tab === 'preview');
  if (tab === 'preview') renderPreview();
}

// ── ADICIONAR MÚSICA ──────────────────────────────────────
function addMusica(data = {}) {
  musicaCount++;
  const id = 'mus-' + musicaCount;
  const n = musicaCount;
  const div = document.createElement('div');
  div.className = 'musica-item';
  div.id = id;
  div.setAttribute('draggable', 'true');
  div.innerHTML = `
    <div class="drag-handle" title="Arraste para reordenar">⠿</div>
    <div class="musica-num">🎵 Música ${n}</div>
    <button class="btn-remove" onclick="removeMusica('${id}')">✕</button>
    <div class="form-row">
      <div class="field">
        <label>Nome da Música</label>
        <input type="text" id="${id}-nome" placeholder="Ex: Grande é o Senhor" value="${data.nome||''}" />
      </div>
      <div class="field">
        <label>Artista / Banda</label>
        <input type="text" id="${id}-artista" placeholder="Ex: Ministério Koinonya" value="${data.artista||''}" />
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Tom</label>
        <input type="text" id="${id}-tom" placeholder="Ex: Dó, Ré, Mi♭" value="${data.tom||''}" />
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>1ª Voz</label>
        <input type="text" id="${id}-v1" placeholder="Nome(s)" value="${data.v1||''}" />
      </div>
      <div class="field">
        <label>2ª Voz</label>
        <input type="text" id="${id}-v2" placeholder="Nome(s)" value="${data.v2||''}" />
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Vozes Adicionais / Coral</label>
        <input type="text" id="${id}-vextra" placeholder="Ex: Ana, Carlos, Marina" value="${data.vextra||''}" />
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Observação desta música</label>
        <input type="text" id="${id}-obs" placeholder="Ex: Repetir o refrão 3x, fade out..." value="${data.obs||''}" />
      </div>
    </div>
  `;
  document.getElementById('musicas-list').appendChild(div);
  initDragDrop(div);
  atualizarContador();
}

function removeMusica(id) {
  document.getElementById(id)?.remove();
  renumerar();
  atualizarContador();
}

// ── LER DADOS ──────────────────────────────────────────────
function coletarDados() {
  const musicas = [];
  document.querySelectorAll('.musica-item').forEach(item => {
    const id = item.id;
    musicas.push({
      nome: v(id+'-nome'), artista: v(id+'-artista'),
      tom: v(id+'-tom'), v1: v(id+'-v1'), v2: v(id+'-v2'),
      vextra: v(id+'-vextra'), obs: v(id+'-obs'),
    });
  });
  return {
    igreja: v('ig-igreja'), data: v('ig-data'), horario: v('ig-horario'),
    tipo: v('ig-tipo'), instrumentista: v('ig-instrumentista'),
    obs: v('ig-obs'), senha: v('ig-senha'), musicas,
  };
}

function v(id) { return document.getElementById(id)?.value?.trim() || ''; }

// ── PREENCHER FORM ─────────────────────────────────────────
function preencherForm(d) {
  sv('ig-igreja', d.igreja); sv('ig-data', d.data); sv('ig-horario', d.horario);
  sv('ig-tipo', d.tipo); sv('ig-instrumentista', d.instrumentista);
  sv('ig-obs', d.obs); sv('ig-senha', d.senha || '');
  document.getElementById('musicas-list').innerHTML = '';
  musicaCount = 0;
  (d.musicas || []).forEach(m => addMusica(m));
}

function sv(id, val) {
  const el = document.getElementById(id);
  if (el && val) el.value = val;
}

// ── GERAR LINK ─────────────────────────────────────────────
function gerarLink() {
  const dados = coletarDados();
  const json = JSON.stringify(dados);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  const url = location.href.split('?')[0] + '?e=' + b64;
  document.getElementById('link-output').value = url;
  document.getElementById('link-box').style.display = 'block';
  document.getElementById('copied-badge').style.display = 'none';
  document.getElementById('link-box').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function copiarLink() {
  const inp = document.getElementById('link-output');
  inp.select(); inp.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); } catch {
    navigator.clipboard.writeText(inp.value);
  }
  const badge = document.getElementById('copied-badge');
  badge.style.display = 'block';
  setTimeout(() => badge.style.display = 'none', 2500);
}

// ── LIMPAR ─────────────────────────────────────────────────
function limpar() {
  if (!confirm('Limpar tudo?')) return;
  ['ig-igreja','ig-data','ig-horario','ig-tipo',
   'ig-instrumentista','ig-obs','ig-senha'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('musicas-list').innerHTML = '';
  musicaCount = 0;
  document.getElementById('link-box').style.display = 'none';
  atualizarContador();
  document.getElementById('dia-semana').textContent = '';
}

// ── RENDER PREVIEW ─────────────────────────────────────────
function renderPreview() {
  const d = coletarDados();
  const fmt = (dt) => {
    if (!dt) return '';
    const [y,m,day] = dt.split('-');
    const d2 = new Date(dt+'T12:00:00');
    const nomesDias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    return `${nomesDias[d2.getDay()]}, ${day}/${m}/${y}`;
  };

  let html = `
    <div class="view-header">
      <div class="church">${d.igreja || 'Igreja'}</div>
      <h2>${d.tipo || 'Escala de Louvor'}</h2>
      <div class="date">${fmt(d.data)}${d.horario ? ' · ' + d.horario : ''}</div>
    </div>

    <div class="info-grid">
      ${d.instrumentista ? `<div class="info-chip"><div class="ic-label">🎹 Instrumentista</div><div class="ic-value">${d.instrumentista}</div></div>` : ''}
    </div>
  `;

  if (d.musicas.length > 0) {
    html += `<div class="musicas-view"><h3>🎵 Músicas da Escala</h3>`;
    d.musicas.forEach((m, i) => {
      if (!m.nome) return;
      const mcls = momentoClasses[m.momento] || 'm-outro';
      html += `
        <div class="musica-card">
          <div class="musica-order">${i+1}</div>
          <div>
            <div class="musica-nome">${m.nome}</div>
            ${m.artista ? `<div class="musica-artista">${m.artista}</div>` : ''}
            <div class="vozes">
              ${m.v1 ? `<span class="voz-tag voz-1">1ª Voz: ${m.v1}</span>` : ''}
              ${m.v2 ? `<span class="voz-tag voz-2">2ª Voz: ${m.v2}</span>` : ''}
              ${m.vextra ? `<span class="voz-tag voz-extra">${m.vextra}</span>` : ''}
              ${m.tom ? `<span class="voz-tag tom-tag">Tom: ${m.tom}</span>` : ''}
            </div>
            ${m.obs ? `<div style="margin-top:10px;font-size:12px;color:var(--muted);">💬 ${m.obs}</div>` : ''}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  if (d.obs) {
    html += `<div class="obs-block"><strong>📝 Observações Gerais</strong>${d.obs}</div>`;
  }

  document.getElementById('preview-content').innerHTML = html;
}

// ── CARREGAR DA URL ─────────────────────────────────────────
function carregarDaURL() {
  const params = new URLSearchParams(location.search);
  const e = params.get('e');
  if (!e) {
    addMusica(); addMusica(); // começa com 2 músicas
    return;
  }
  try {
    const json = decodeURIComponent(escape(atob(e)));
    const dados = JSON.parse(json);
    preencherForm(dados);
    atualizarDiaSemana();
    atualizarContador();
    // auto-switch para preview
    switchTab('preview');
  } catch(err) {
    console.error('Erro ao carregar escala:', err);
    addMusica();
  }
}

// ── SENHA ────────────────────────────────────────────────
function pedirSenhaEditar() {
  const dados = coletarDadosURL();
  if (!dados || !dados.senha) {
    switchTab('editor');
    return;
  }
  document.getElementById('modal-senha-input').value = '';
  document.getElementById('modal-erro').textContent = '';
  document.getElementById('modal-senha').classList.add('active');
  setTimeout(() => document.getElementById('modal-senha-input').focus(), 100);
}

function confirmarSenha() {
  const dados = coletarDadosURL();
  const digitada = document.getElementById('modal-senha-input').value;
  if (digitada === dados.senha) {
    fecharModal();
    switchTab('editor');
  } else {
    document.getElementById('modal-erro').textContent = '❌ Senha incorreta.';
    document.getElementById('modal-senha-input').value = '';
    document.getElementById('modal-senha-input').focus();
  }
}

function fecharModal() {
  document.getElementById('modal-senha').classList.remove('active');
}

function coletarDadosURL() {
  const params = new URLSearchParams(location.search);
  const e = params.get('e');
  if (!e) return null;
  try {
    return JSON.parse(decodeURIComponent(escape(atob(e))));
  } catch { return null; }
}

// Inicializar tudo após DOM estar pronto
document.addEventListener('DOMContentLoaded', function() {
  carregarDaURL();

  document.getElementById('modal-senha').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });

  document.getElementById('modal-senha-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') confirmarSenha();
  });
});
</script>
<!-- Modal de senha -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <div class="modal-title">🔒 Editar Escala</div>
    <div class="modal-sub">Esta escala está protegida. Digite a senha para editar.</div>
    <input type="password" class="modal-input" id="modal-senha-input" placeholder="Senha" autocomplete="off" />
    <div class="modal-error" id="modal-erro"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarSenha()">Entrar</button>
    </div>
  </div>
</div>

</body>
</html>
